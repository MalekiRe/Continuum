<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continuum — chat</title>
<style>
body{background:#0d1117;color:#c9d1d9;font:14px/1.5 sans-serif;margin:0 auto;padding:20px;max-width:800px}
#messages{display:flex;flex-direction:column;gap:8px;height:70vh;overflow-y:auto;padding:12px;background:#161b22;border:1px solid #30363d;border-radius:6px;margin-bottom:12px}
.msg{padding:8px 12px;border-radius:6px;max-width:80%;line-height:1.5}.user{background:#1f6feb;align-self:flex-end;color:#fff}.agent{background:#21262d;align-self:flex-start;border:1px solid #30363d}.meta{font-size:11px;color:#8b949e;margin-top:4px}
form{display:flex;gap:8px}input{flex:1;padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9}button{padding:10px 20px;border:0;border-radius:6px;background:#238636;color:#fff}
</style>
</head>
<body>
<div id="messages"></div>
<form id="chat"><input name="message" placeholder="Type a message..." autofocus><button>Send</button></form>
<script>
const messages=document.querySelector('#messages'),form=document.querySelector('#chat');
async function refresh(){messages.innerHTML=await (await fetch('/chat/history')).text();messages.scrollTop=messages.scrollHeight}
form.addEventListener('submit',async event=>{event.preventDefault();await fetch('/chat/send',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form))});form.reset();await refresh()});
refresh();setInterval(refresh,2000);
</script>
</body></html>

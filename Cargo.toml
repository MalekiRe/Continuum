[package]
name = "persistent-lisp-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12"
urlencoding = "2.1"
dotenvy = "0.15"
uuid = { version = "1.26.0", features = ["v4"] }

[[bin]]
name = "plh"
path = "src/main.rs"

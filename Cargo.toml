[package]
name = "persistent-lisp-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3.3"
chrono = "0.4.45"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rustyline = { version = "18.0.1", features = ["with-file-history"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.26.0", features = ["v4"] }

[[bin]]
name = "plh"
path = "src/main.rs"

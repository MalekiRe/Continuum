          git apply --whitespace=fix /tmp/runtime-fixes.patch

          perl -0pi -e 's/result == "\\\"done\\\""/result == "done"/' tests/scheduler.rs

          cat >> tests/repl.rs <<'EOF'

          #[test]
          fn rhs_tail_calls_restore_the_enclosing_lexical_scope() {
              let mut kernel = Kernel::new();
              kernel.eval("(define (id x) x)").unwrap();
              assert_eq!(
                  kernel
                      .eval("(let ((a 1)) (begin (set! a (id 2)) a))")
                      .unwrap(),
                  Value::Int(2)
              );
              assert_eq!(
                  kernel
                      .eval("(let ((a 3)) (begin (define user/from-local (id a)) a))")
                      .unwrap(),
                  Value::Int(3)
              );
          }

          #[test]
          fn registered_native_bindings_are_immutable() {
              let mut kernel = Kernel::new();
              for name in [
                  "agent/call",
                  "message/reply",
                  "model/call",
                  "memory/remember",
                  "source/get",
              ] {
                  assert!(kernel.eval(&format!("(define {name} 1)")).is_err());
                  assert!(kernel.eval(&format!("(undefine {name})")).is_err());
                  assert_eq!(
                      kernel.eval(&format!("(function? {name})")).unwrap(),
                      Value::Bool(true)
                  );
              }
          }
          EOF

          cat >> tests/scheduler.rs <<'EOF'

          #[test]
          fn agent_boundaries_require_strings() {
              let mut kernel = Kernel::new();
              assert!(kernel.eval("(agent/call 'researcher \"task\")").is_err());
              assert!(kernel.eval("(agent/call \"researcher\" 'task)").is_err());
              kernel.spawn_subagent("researcher", "task").unwrap();
              assert!(kernel.eval("(agent/return 42)").is_err());
          }

          #[tokio::test]
          async fn human_wait_is_snapshot_safe_and_wakes_on_message() {
              let (scheduler, _) = scheduler(&["(human/wait)", "nil"]);
              let mut kernel = Kernel::new();
              let outcome = scheduler.run_turn(&mut kernel).await.unwrap();
              assert!(matches!(outcome, TurnOutcome::ToolCompleted { .. }));
              assert_eq!(
                  kernel.frames()[0].status(),
                  persistent_lisp_harness::FrameStatus::Waiting
              );
              assert!(!kernel.has_trap());

              let snapshots = temp_root("wait-snapshot");
              kernel.set_snapshot_directory(&snapshots);
              kernel.snapshot().unwrap();
              kernel.human_message("resume").unwrap();
              assert_eq!(
                  kernel.frames()[0].status(),
                  persistent_lisp_harness::FrameStatus::Running
              );
              scheduler.run_turn(&mut kernel).await.unwrap();
          }

          #[test]
          fn constrained_context_keeps_the_newest_transcript_entries() {
              let (scheduler, _) = scheduler(&[]);
              let mut kernel = Kernel::new();
              for index in 0..30 {
                  kernel.append_transcript(
                      &format!("action-{index}"),
                      &format!("result-{index}-{}", "x".repeat(1_500)),
                  );
              }
              let request = scheduler.build_request(&kernel);
              assert!(request.context.contains("action-29"));
              assert!(request.context.contains("action-28"));
              assert!(!request.context.contains("action-0"));
          }
          EOF

          cat >> tests/snapshot_behavior.rs <<'EOF'

          #[test]
          fn snapshots_round_trip_maps_with_arbitrary_lisp_keys() {
              let dir = temp_dir();
              let mut kernel = Kernel::new();
              kernel.set_snapshot_directory(&dir);
              kernel
                  .eval("(define user/mixed-map {:mode \"fast\" 1 \"one\" '(a b) 3})")
                  .unwrap();
              kernel.snapshot().unwrap();

              let mut recovered = Kernel::recover_from_dir(&dir).unwrap();
              assert_eq!(
                  recovered.eval("(map/get mixed-map :mode)").unwrap(),
                  Value::string("fast")
              );
              assert_eq!(
                  recovered.eval("(map/get mixed-map 1)").unwrap(),
                  Value::string("one")
              );
              assert_eq!(
                  recovered.eval("(map/get mixed-map '(a b))").unwrap(),
                  Value::Int(3)
              );
          }
          EOF


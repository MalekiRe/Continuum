        match eval_step(current, kernel) {
            Ok(StepResult::Done(value)) => break Ok(value),
            Ok(StepResult::Step(next)) => current = next,
            Err(error) => break Err(error),
        }
    };
    kernel.env.activate_environment(caller_environment)?;
    result

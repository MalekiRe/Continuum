name: Reduce source LOC

on:
  push:
    branches:
      - codex/reduce-loc

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reduce-loc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply refactor
        run: |
          sed -i '/count = text.scan/a\  return if count == 0' scripts/codex_reduce_loc.rb
          ruby scripts/codex_reduce_loc.rb
          ruby <<'RUBY'
          path = "src/vm/value.rs"
          text = File.read(path)
          start = text.index('            Value::List(items) => {') or abort "missing list formatter"
          finish = text.index('            Value::Map(map) => {', start) or abort "missing map formatter"
          replacement = <<~'RUST'
                        Value::List(items) => write_values(f, "(", items, ")"),
                        Value::Vector(items) => write_values(f, "#(", items, ")"),
          RUST
          File.write(path, text[0...start] + replacement + text[finish..])
          RUBY
          ruby -e 'path = "src/scheduler.rs"; text = File.read(path); text.sub!(/\n}\n}\s*\z/, "\n}\n") or abort "expected duplicate scheduler brace"; File.write(path, text)'
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Report source reduction
        run: |
          echo 'Changed source lines:'
          git diff --numstat -- src
          echo 'Current Rust source LOC:'
          find src -name '*.rs' -print0 | xargs -0 wc -l | tail -1
      - name: Commit refactor
        run: |
          rm scripts/codex_reduce_loc.rb .github/workflows/codex-reduce-loc.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reduce runtime LOC with shared helpers'
          git push
